name: Android APK

# يبني تطبيق أندرويد (WebView) وينشره في Releases:
# https://github.com/ya3in3335/Grewd/releases/latest/download/khadamat-dz.apk
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "assets/**"
      - "icons/**"
      - "data/config.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # اختياري: مفتاح توقيع خاص عبر Settings → Secrets → Actions
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "using private signing key"
          else
            echo "using bundled dev key (android/keystore/dev.jks)"
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Prepare release
        id: v
        run: |
          VER=$(jq -r .appVersion data/config.json)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk khadamat-dz.apk
          sha256sum khadamat-dz.apk | tee khadamat-dz.apk.sha256

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.v.outputs.ver }}-build${{ github.run_number }}
          name: خدمات DZ ${{ steps.v.outputs.ver }} (build ${{ github.run_number }})
          make_latest: "true"
          files: |
            khadamat-dz.apk
            khadamat-dz.apk.sha256
          body: |
            ## 📲 تطبيق خدمات DZ لأندرويد
            **تحميل مباشر:** [khadamat-dz.apk](https://github.com/${{ github.repository }}/releases/latest/download/khadamat-dz.apk)

            1. حمّل الملف وافتحو.
            2. إذا طلب منك الهاتف، اسمح بـ «تثبيت تطبيقات من مصادر غير معروفة».
            3. التطبيق يتحدّث وحدو: المحتوى والأسعار تجي مباشرة من الموقع.

            أندرويد 7.0 فما فوق · الإصدار ${{ steps.v.outputs.ver }}
