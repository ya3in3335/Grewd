name: Publish site

# الموقع يُنشر من فرع gh-pages. أي تعديل على main (كود أو بيانات) يُنسخ تلقائياً.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:gh-pages
