name: Update live data

# يحدّث أسعار العملات والذهب في data/live.json كل 6 ساعات
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-data.mjs
      - name: Commit and publish
        run: |
          if git diff --quiet -- data/live.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -m "data: تحديث تلقائي للأسعار"
          git push origin HEAD:main
          # الدفع بـ GITHUB_TOKEN لا يشغّل workflow آخر، لذا ننشر مباشرة
          git push --force origin HEAD:gh-pages
